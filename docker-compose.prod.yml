services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      # Force l'environnement de prod, indépendamment de ce que contient
      # .env.local (qui ne doit porter que des secrets, pas ces réglages) :
      # sans ça, un APP_ENV/APP_DEBUG résiduel dans .env.local écrase le
      # ENV du Dockerfile au runtime et fait planter le site (DebugBundle
      # absent car exclu par `composer install --no-dev`).
      APP_ENV: prod
      APP_DEBUG: "0"
    expose:
      - "10000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
    ports:
      # Bindé sur le loopback du VPS uniquement (pas exposé sur Internet) :
      # permet un accès via tunnel SSH sans ouvrir le port publiquement.
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
